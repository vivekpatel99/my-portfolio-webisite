<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title description">
<title id="title">Sample schedule workbook. Fictional data.</title>
<desc id="description">Fictional rows for Person A. Exact exported fields are NAME, Date, Year, WEEKDAY, SHIFT, and REQUEST. This is not a full client workbook and not a client export. Code 0 is OFF for yellow or pink. Code 1 is Available when the highlight is missing or near-white. Code 2 is Request to Work for green. An unknown color and an unreadable date are skipped.</desc>
