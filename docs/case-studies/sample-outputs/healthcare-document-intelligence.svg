<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title description">
<title id="title">Schedule workbook. Illustrative output using fictional data.</title>
<desc id="description">A fictional staff-schedule table contains date 2026-09-07, shift Day, request code P, and date 2026-09-08, shift Night, request code U. The sample legend defines P as preferred shift and U as unavailable. This is operational staff-schedule data, not patient records or a verified workbook export.</desc>
<rect x="0" y="0" width="1080" height="810" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="100" fill="#F5F3FF"/>
<line x1="0" y1="0" x2="1080" y2="0" stroke="#6D28D9" stroke-width="8"/>
<text x="64" y="65" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#6D28D9">Illustrative output | Fictional data</text>
<text x="64" y="174" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1E293B">Schedule workbook</text>
<text x="64" y="232" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#475569">Two fictional Excel rows</text>
<rect x="64" y="282" width="952" height="66" fill="#F5F3FF"/>
<line x1="64" y1="282" x2="1016" y2="282" stroke="#6D28D9" stroke-width="3"/>
<text x="88" y="328" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">Date</text>
<text x="530" y="328" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">Shift</text>
<text x="846" y="328" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">Code</text>
<text x="88" y="416" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="48" font-weight="400" fill="#1E293B">2026-09-07</text>
<text x="530" y="416" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#1E293B">Day</text>
<text x="870" y="416" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="48" font-weight="400" fill="#1E293B">P</text>
<line x1="64" y1="450" x2="1016" y2="450" stroke="#CBD5E1" stroke-width="2"/>
<text x="88" y="514" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="48" font-weight="400" fill="#1E293B">2026-09-08</text>
<text x="530" y="514" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#1E293B">Night</text>
<text x="870" y="514" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="48" font-weight="400" fill="#1E293B">U</text>
<line x1="64" y1="548" x2="1016" y2="548" stroke="#CBD5E1" stroke-width="2"/>
<text x="64" y="625" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#475569">P = preferred shift</text>
<text x="64" y="687" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#475569">U = unavailable</text>
<text x="64" y="758" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">Staff schedule data only.</text>
</svg>
