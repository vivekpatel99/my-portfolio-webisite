<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title description">
<title id="title">CSV and JSONL snippet. Illustrative output using fictional data.</title>
<desc id="description">An illustrative CSV snippet has columns listing_id and url, with fictional rows A and B at https://listing.example/A and https://listing.example/B. The JSONL snippet stores the same listing_id and url on each line. Restart reads listing_id from that JSONL and skips those listings. Other saved fields are omitted. Values are fictional, not a client export.</desc>
<rect x="0" y="0" width="1080" height="810" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="96" fill="#F5F3FF"/>
<line x1="0" y1="0" x2="1080" y2="0" stroke="#6D28D9" stroke-width="8"/>
<text x="64" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#6D28D9">Illustrative output | Fictional data</text>
<text x="64" y="156" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#1E293B">CSV and JSONL snippet</text>
<text x="64" y="204" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#475569">Fictional values. Visible fields: listing_id and url.</text>
<rect x="64" y="236" width="952" height="400" fill="#F8FAFC"/>
<line x1="64" y1="236" x2="1016" y2="236" stroke="#6D28D9" stroke-width="3"/>
<text x="88" y="286" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6D28D9">CSV</text>
<text x="88" y="338" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="32" font-weight="700" fill="#6D28D9">listing_id,url</text>
<line x1="88" y1="356" x2="992" y2="356" stroke="#CBD5E1" stroke-width="2"/>
<text x="88" y="412" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="30" font-weight="400" fill="#1E293B">A,https://listing.example/A</text>
<text x="88" y="468" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="30" font-weight="400" fill="#1E293B">B,https://listing.example/B</text>
<text x="88" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6D28D9">JSONL</text>
<text x="88" y="578" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="26" font-weight="400" fill="#1E293B">{"listing_id":"A","url":"https://listing.example/A"}</text>
<text x="88" y="626" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="26" font-weight="400" fill="#1E293B">{"listing_id":"B","url":"https://listing.example/B"}</text>
<text x="64" y="700" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E293B">Restart reads listing_id from the JSONL and skips those listings.</text>
<text x="64" y="752" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#475569">The JSONL is the resume record. Other saved fields are omitted.</text>
</svg>
