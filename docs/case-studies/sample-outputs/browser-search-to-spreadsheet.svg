<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title description">
<title id="title">Search result sheet. Illustrative output using fictional data.</title>
<desc id="description">A fictional spreadsheet row shows the search input Vienna to Lisbon, result URL https://example.org/R1, timestamp 2026-09-01 09:30 UTC, and status Recorded. This illustrates a result handoff, not booking completion or an actual browser run.</desc>
<rect x="0" y="0" width="1080" height="810" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="100" fill="#F5F3FF"/>
<line x1="0" y1="0" x2="1080" y2="0" stroke="#6D28D9" stroke-width="8"/>
<text x="64" y="65" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#6D28D9">Illustrative output | Fictional data</text>
<text x="64" y="174" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1E293B">Search result sheet</text>
<text x="64" y="232" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#475569">One fictional spreadsheet row</text>
<rect x="64" y="280" width="952" height="360" fill="#F8FAFC"/>
<line x1="64" y1="280" x2="1016" y2="280" stroke="#6D28D9" stroke-width="3"/>
<line x1="64" y1="370" x2="1016" y2="370" stroke="#CBD5E1" stroke-width="2"/>
<line x1="64" y1="460" x2="1016" y2="460" stroke="#CBD5E1" stroke-width="2"/>
<line x1="64" y1="550" x2="1016" y2="550" stroke="#CBD5E1" stroke-width="2"/>
<line x1="64" y1="640" x2="1016" y2="640" stroke="#CBD5E1" stroke-width="2"/>
<text x="88" y="337" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#475569">Search input</text>
<text x="386" y="337" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#1E293B">Vienna to Lisbon</text>
<text x="88" y="427" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#475569">Result URL</text>
<text x="386" y="427" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="44" font-weight="400" fill="#1E293B">https://example.org/R1</text>
<text x="88" y="517" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#475569">Timestamp</text>
<text x="386" y="517" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="42" font-weight="400" fill="#1E293B">2026-09-01 09:30 UTC</text>
<text x="88" y="607" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#475569">Status</text>
<text x="386" y="607" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#1E293B">Recorded</text>
<text x="64" y="738" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#475569">Search output only. Booking is not shown.</text>
</svg>
