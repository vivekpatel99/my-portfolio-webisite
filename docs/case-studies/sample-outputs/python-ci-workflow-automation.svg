<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title description">
<title id="title">Code-quality notes. Illustrative output using fictional data.</title>
<desc id="description">A fictional report has a representative unused-import lint message, a draft review note to check an empty-input case, and PR-helper handoff notes about input validation and review. No linter run, review acceptance, CI result, pull-request action or merge is represented.</desc>
<rect x="0" y="0" width="1080" height="810" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="100" fill="#F5F3FF"/>
<line x1="0" y1="0" x2="1080" y2="0" stroke="#6D28D9" stroke-width="8"/>
<text x="64" y="65" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#6D28D9">Illustrative output | Fictional data</text>
<text x="64" y="174" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1E293B">Code-quality notes</text>
<text x="64" y="232" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#475569">Representative handoff text</text>
<line x1="64" y1="266" x2="1016" y2="266" stroke="#6D28D9" stroke-width="3"/>
<text x="64" y="310" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">Lint message</text>
<text x="64" y="365" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="44" font-weight="400" fill="#1E293B">example.py:8  Unused import</text>
<text x="64" y="443" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">AI-assisted review draft</text>
<text x="64" y="498" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="44" font-weight="400" fill="#1E293B">Check the empty-input case.</text>
<text x="64" y="576" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6D28D9">PR-helper notes</text>
<text x="64" y="631" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="44" font-weight="400" fill="#1E293B">Change: add input validation.</text>
<text x="64" y="686" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="42" font-weight="400" fill="#1E293B">Check: review empty-input handling.</text>
<text x="64" y="767" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#475569">Example text. No tool run is shown.</text>
</svg>
