name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || vars.PRODUCTION_CONVEX_URL || vars.CONVEX_URL || secrets.VITE_CONVEX_URL || secrets.PRODUCTION_CONVEX_URL || secrets.CONVEX_URL }}
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate production-like Convex URL
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_CONVEX_URL:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::warning title=Missing Convex URL::Using the temporary PR fallback https://coordinated-mandrill-587.eu-west-1.convex.cloud"
              VITE_CONVEX_URL="https://coordinated-mandrill-587.eu-west-1.convex.cloud"
            else
              echo "::error title=Missing Convex URL::Set the VITE_CONVEX_URL repository variable (or secret) to the production Convex deployment URL."
              exit 1
            fi
          fi

          echo "VITE_CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV"

          if [[ ! "$VITE_CONVEX_URL" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)?\.convex\.cloud/?$ ]]; then
            echo "::error title=Invalid Convex URL::VITE_CONVEX_URL must be a production-like https://*.convex.cloud URL, including regional Convex hosts."
            exit 1
          fi

          if [[ "$VITE_CONVEX_URL" =~ ^https://(your-|example\.) || "$VITE_CONVEX_URL" =~ (placeholder|localhost|127\.0\.0\.1|\[::1\]) ]]; then
            echo "::error title=Unsafe Convex URL::VITE_CONVEX_URL must not point at a local or placeholder backend."
            exit 1
          fi
      - name: Remove stale build output
        run: rm -rf dist
      - name: Build production bundle
        run: npm run build
      - name: Validate fresh production bundle
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d dist ]]; then
            echo "::error title=Missing dist::Build did not create a dist directory."
            exit 1
          fi

          if ! find dist -type f -print -quit | grep -q .; then
            echo "::error title=Empty dist::Build created dist but no files."
            exit 1
          fi

          if ! grep -R --fixed-strings --quiet "$VITE_CONVEX_URL" dist; then
            echo "::error title=Convex URL missing::Fresh dist does not contain the configured VITE_CONVEX_URL."
            exit 1
          fi

          if grep -RInEi 'supabase' dist; then
            echo "::error title=Supabase reference found::Fresh dist must not contain Supabase strings."
            exit 1
          fi

          if grep -RInE '(https?|wss?)://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:[0-9]+)?|https?:\\?/\\?/(yourserver\.io|(placeholder|your-deployment|example)[-.a-z0-9]*\.convex\.cloud)' dist; then
            echo "::error title=Unsafe backend URL found::Fresh dist must not contain local or placeholder backend URLs."
            exit 1
          fi
      - name: Ensure generated dist is not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo "::error title=Tracked dist found::dist/ is generated output and must not be tracked."
            git ls-files dist
            exit 1
          fi
      - name: Archive validated production bundle
        run: tar -czf "$RUNNER_TEMP/production-dist.tar.gz" dist
      - name: Share validated production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ${{ runner.temp }}/production-dist.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  passive-qa:
    needs: production-build
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      QA_LOCAL_ONLY: "1"
      QA_ARTIFACT_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for repository checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ${{ runner.temp }}/production-dist
      - name: Restore production bundle
        run: tar -xzf "$RUNNER_TEMP/production-dist/production-dist.tar.gz"
      - name: Run passive Playwright QA against preview
        shell: bash
        env:
          QA_PREVIEW_URL: http://127.0.0.1:3000
          QA_PROD_URL: http://127.0.0.1:3000
          QA_LOCAL_ONLY: "1"
          QA_ARTIFACT_SAFE_MODE: "1"
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 --port 3000 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT

          for i in {1..30}; do
            if curl --fail --silent --show-error "$QA_PREVIEW_URL" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error "$QA_PREVIEW_URL" >/dev/null
          npm run qa:seo
          npm run qa:playwright:ci -- --shard=${{ matrix.shard }}/2
      - name: Reconstruct sanitized passive QA artifacts
        id: sanitize-qa-artifacts
        if: always()
        run: node tools/sanitize-playwright-artifacts.js
      - name: Retain sanitized passive QA artifacts
        if: always() && steps.sanitize-qa-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: passive-qa-sanitized-${{ matrix.shard }}
          path: |
            qa-artifacts/summary.json
            qa-artifacts/failure-results.json
          if-no-files-found: ignore
          retention-days: 7
  contact-qa:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      QA_LOCAL_ONLY: "1"
      QA_ARTIFACT_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for repository checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      - name: Run mocked contact lifecycle QA
        env:
          QA_LOCAL_ONLY: "1"
          QA_ARTIFACT_SAFE_MODE: "1"
        run: npm run qa:contact-lifecycle
  motion-qa:
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      QA_LOCAL_ONLY: "1"
      QA_ARTIFACT_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for repository checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      - name: Run reduced-motion regression QA
        shell: bash
        run: |
          set -euo pipefail

          QA_MOTION_OUTPUT_DIR="$(mktemp -d "$RUNNER_TEMP/qa-motion.XXXXXX")"
          export QA_MOTION_OUTPUT_DIR
          trap 'rm -rf "$QA_MOTION_OUTPUT_DIR"' EXIT

          npm run qa:motion -- --project=motion-${{ matrix.browser }}-desktop --project=motion-${{ matrix.browser }}-mobile
  telemetry-qa:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      QA_LOCAL_ONLY: "1"
      QA_ARTIFACT_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for repository checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      - name: Validate production-like Convex URL
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_CONVEX_URL:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::warning title=Missing Convex URL::Using the temporary PR fallback https://coordinated-mandrill-587.eu-west-1.convex.cloud"
              VITE_CONVEX_URL="https://coordinated-mandrill-587.eu-west-1.convex.cloud"
            else
              echo "::error title=Missing Convex URL::Set the VITE_CONVEX_URL repository variable (or secret) to the production Convex deployment URL."
              exit 1
            fi
          fi

          echo "VITE_CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV"

          if [[ ! "$VITE_CONVEX_URL" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)?\.convex\.cloud/?$ ]]; then
            echo "::error title=Invalid Convex URL::VITE_CONVEX_URL must be a production-like https://*.convex.cloud URL, including regional Convex hosts."
            exit 1
          fi

          if [[ "$VITE_CONVEX_URL" =~ ^https://(your-|example\.) || "$VITE_CONVEX_URL" =~ (placeholder|localhost|127\.0\.0\.1|\[::1\]) ]]; then
            echo "::error title=Unsafe Convex URL::VITE_CONVEX_URL must not point at a local or placeholder backend."
            exit 1
          fi
      - name: Run fake telemetry boundary QA
        env:
          QA_LOCAL_ONLY: "1"
          QA_ARTIFACT_SAFE_MODE: "1"
        run: npm run qa:telemetry-boundary
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - unit-tests
      - production-build
      - passive-qa
      - contact-qa
      - motion-qa
      - telemetry-qa
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require every CI job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/check-ci-results.js
