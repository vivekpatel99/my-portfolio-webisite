name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fail if committed bundle points at local services
        run: "! grep -RInE 'https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?' dist/assets"

      - name: Fail if committed bundle lacks Convex cloud URL
        run: grep -q '\.convex\.cloud' dist/assets/*.js

      - run: npm run build
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud

      - name: Fail if Supabase references remain in production bundle
        run: '! grep -riq supabase dist/assets'
